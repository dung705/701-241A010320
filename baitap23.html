<main>
<section class="card">
<h2>Bài tập 23: Countdown Timer 10 phút</h2>
<div id="timer" aria-live="polite">10:00</div>
<p style="text-align:center">
  <button class="button" id="startBtn">Bắt đầu</button>
  <button class="button" id="resetBtn">Đặt lại</button>
</p>
</section>
<script>
const timer = document.getElementById("timer");
const startBtn = document.getElementById("startBtn");
const resetBtn = document.getElementById("resetBtn");
const TOTAL_TIME = 600;
let timeLeft = TOTAL_TIME;
let interval = null;
let endTime = 0;
function displayTime(seconds) {
  timer.textContent = String(Math.floor(seconds / 60)).padStart(2, "0") + ":" +
    String(seconds % 60).padStart(2, "0");
  timer.classList.toggle("warning", seconds < 60);
}
function stopTimer() {
  clearInterval(interval);
  interval = null;
  startBtn.disabled = false;
}
function updateTimer() {
  timeLeft = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
  displayTime(timeLeft);
  if (timeLeft <= 0) {
    stopTimer();
    alert("Đã hết thời gian!");
  }
}
startBtn.addEventListener("click", () => {
  if (interval !== null || timeLeft <= 0) return;
  endTime = Date.now() + timeLeft * 1000;
  startBtn.disabled = true;
  updateTimer();
  if (timeLeft > 0) interval = setInterval(updateTimer, 250);
});
resetBtn.addEventListener("click", () => {
  stopTimer();
  timeLeft = TOTAL_TIME;
  displayTime(timeLeft);
});
displayTime(timeLeft);
</script>
</main>
